# Builds the runtime and simulator kits and publishes them as the
# `flutter-<version>` release that aera-flutter-template downloads from.
# Run it from the Actions tab (Run workflow).
name: Kits
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter release the kits are for
        default: 3.47.5
permissions:
  contents: write
env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
jobs:
  engine:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.rev.outputs.revision }}
    steps:
      - id: rev
        run: echo "revision=$(curl -fsSL https://raw.githubusercontent.com/flutter/flutter/$FLUTTER_VERSION/bin/internal/engine.version)" >> "$GITHUB_OUTPUT"

  runtime:
    needs: engine
    runs-on: ubuntu-24.04-arm
    env:
      ENGINE: ${{ needs.engine.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison flex glslang-tools python3-pip \
            libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev libvulkan-dev libclang-dev \
            fonts-roboto-unhinted unzip
          pip3 install --user --break-system-packages 'meson>=1.4' mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/build_mesa.sh "$RUNNER_TEMP/mesa"
      - run: cargo build --release --no-default-features --bin aera-browser-worker
      - run: |
          base=https://storage.googleapis.com/flutter_infra_release/flutter/$ENGINE
          curl -fsSL -o engine.zip $base/linux-arm64/linux-arm64-embedder.zip
          curl -fsSL -o artifacts.zip $base/linux-x64/artifacts.zip
          unzip -o engine.zip libflutter_engine.so -d engine
          unzip -o artifacts.zip icudtl.dat -d engine
      - run: |
          python3 tools/assemble_runtime.py --out runtime \
            --worker target/release/aera-browser-worker \
            --engine engine/libflutter_engine.so --icu engine/icudtl.dat \
            --mesa "$RUNNER_TEMP/mesa" --readelf readelf \
            --sysroot /usr/lib/aarch64-linux-gnu --sysroot /lib/aarch64-linux-gnu \
            --fonts /usr/share/fonts/truetype/roboto/unhinted/RobotoTTF
          echo "$FLUTTER_VERSION" > runtime/flutter-version
          echo "$ENGINE" > runtime/engine-revision
          tar -C runtime -cJf aera-flutter-runtime-arm64-$FLUTTER_VERSION.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: aera-flutter-runtime-arm64-*.tar.xz

  simkit:
    needs: engine
    runs-on: ubuntu-24.04
    env:
      ENGINE: ${{ needs.engine.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev unzip
      - run: cargo build --release
      - run: |
          base=https://storage.googleapis.com/flutter_infra_release/flutter/$ENGINE
          curl -fsSL -o engine.zip $base/linux-x64/linux-x64-embedder.zip
          curl -fsSL -o artifacts.zip $base/linux-x64/artifacts.zip
          kit=simkit
          mkdir -p $kit/bin $kit/usr/lib $kit/usr/share/flutter
          cp target/release/aera-browser-worker target/release/aera-host-sim $kit/bin/
          unzip -p engine.zip libflutter_engine.so > $kit/usr/lib/libflutter_engine.so
          unzip -p artifacts.zip icudtl.dat > $kit/usr/share/flutter/icudtl.dat
          echo "$FLUTTER_VERSION" > $kit/flutter-version
          echo "$ENGINE" > $kit/engine-revision
          tar -C $kit -cJf aera-flutter-simkit-x64-$FLUTTER_VERSION.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: simkit
          path: aera-flutter-simkit-x64-*.tar.xz

  release:
    needs: [engine, runtime, simkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ inputs.flutter_version }}
          target_commitish: ${{ github.sha }}
          name: Kits for Flutter ${{ inputs.flutter_version }}
          body: |
            Kits used by aera-flutter-template for Flutter ${{ inputs.flutter_version }} (engine ${{ needs.engine.outputs.revision }}).
            - `aera-flutter-runtime-arm64`: everything an app needs inside AERA's browser jail (glibc, Flutter engine, Mesa 26.2.2 with Zink + Turnip KGSL, Roboto, the embedder).
            - `aera-flutter-simkit-x64`: the embedder, `aera-host-sim` and the x64 engine for running apps on a PC.
          files: '*.tar.xz'
